<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PredictAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">
    <main class="auth-card">
        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-mark">P</span>
            <span>PredictAI</span>
        </a>
        <h1>Welcome back</h1>
        <p>Sign in to open your customer purchase intelligence workspace.</p>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            {{ form.hidden_tag() }}
            <label>
                <span>Username</span>
                {{ form.username() }}
            </label>
            <label>
                <span>Password</span>
                {{ form.password() }}
            </label>
            {{ form.submit(class="button button-primary") }}
        </form>

        <p class="auth-switch">New to PredictAI? <a href="{{ url_for('register') }}">Create an account</a></p>
    </main>
</body>

</html>
